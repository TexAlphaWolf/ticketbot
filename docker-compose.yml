# TicketBot: the bot and the web dashboard, from the same image.
#
#   docker compose up -d --build                     bot + dashboard, SQLite in ./data
#   docker compose --profile postgres up -d --build  the same, plus a PostgreSQL server
#
# The dashboard is on http://127.0.0.1:8080 (only from this computer). To reach it from
# outside, put a reverse proxy or a tunnel in front of it and set WEB_PUBLIC_URL in .env.

x-ticketbot: &ticketbot
  build: .
  image: ticketbot:3.0.0b3
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
      required: false            # only with --profile postgres

services:
  ticketbot:
    <<: *ticketbot
    container_name: ticketbot

  web:
    <<: *ticketbot
    container_name: ticketbot-web
    # Waits until the bot has created or updated the database
    command: ["python", "-m", "ticketbot", "web", "--wait", "180"]
    environment:
      WEB_HOST: 0.0.0.0          # inside the container; the port below decides who sees it
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"WEB_PORT\", \"8080\")}/api/v1/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # Optional: start it with --profile postgres and set in .env
  #   POSTGRES_PASSWORD=a-long-random-password
  #   DATABASE_URL=postgresql://ticketbot:a-long-random-password@postgres:5432/ticketbot
  postgres:
    image: postgres:18
    container_name: ticketbot-postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketbot
      POSTGRES_DB: ticketbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}   # empty: PostgreSQL refuses to start and says so
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbot -d ticketbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres:
