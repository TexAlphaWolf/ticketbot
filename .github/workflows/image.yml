# The Docker image on GitHub Container Registry, for PCs (amd64) and Raspberry Pi (arm64),
# at every version tag: ghcr.io/texalphawolf/ticketbot:3.0.0 (and :latest for the
# stable versions, not for betas). A server then pulls it instead of building it.
# Started by hand (Actions → Image → Run workflow) it is tagged with the branch, e.g.
# :v3-dev, to try it before a release.
name: Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish (amd64, arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ticketbot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=TicketBot
            org.opencontainers.image.description=Discord ticket bot with a web dashboard
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
